services:

  postgres:
    image: postgres:16
    container_name: eventos_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: eventos_user
      POSTGRES_PASSWORD: eventos_password
      POSTGRES_DB: plataforma_eventos

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: eventos_backend
    restart: unless-stopped

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://eventos_user:eventos_password@postgres:5432/plataforma_eventos
      FRONTEND_URL: http://localhost:8080

    ports:
      - "3000:3000"

    depends_on:
      - postgres


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: http://localhost:3000/api

    container_name: eventos_frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend


volumes:
  postgres_data: